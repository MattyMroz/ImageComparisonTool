<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="An advanced tool for comparing multiple images with zoom, pan, and synchronized swipe/animation features.">
    <meta name="keywords"
        content="image comparison, compare images, diff images, image tool, photo comparison, image diff, visual comparison">
    <meta name="author" content="Image Comparison Tool">
    <title>Image Comparison Tool</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            overflow: hidden;
            padding: 15px;
            padding-top: 0;
            box-sizing: border-box;
        }


        #controls {
            padding: 12px 20px;
            background-color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            flex-wrap: wrap;
            border-bottom: 1px solid #444;
            margin: 0 -15px;
            padding-left: 35px;
            padding-right: 35px;
        }

        .control-section {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .separator {
            color: #555;
            font-size: 1.5em;
            line-height: 2.5;
            padding: 0 5px;
            align-self: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 5px;
        }

        .control-group label {
            margin-bottom: 2px;
            font-size: 0.85em;
            color: #bbb;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #controls select,
        #controls button {
            padding: 7px 10px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #444;
            color: #eee;
            font-size: 0.9em;
        }

        #controls input[type="range"] {
            padding: 0;
            margin: 7px 0;
            border-radius: 4px;
            border: 0 solid #555;
            background-color: #444;
            color: #eee;
            font-size: 0.9em;
            vertical-align: middle;
            min-width: 100px;
            accent-color: #007bff;
            box-sizing: border-box;
        }

        #controls select:focus,
        #controls input[type="range"]:focus {
            outline: none;
            border-color: #007bff;
        }

        #controls select {
            min-width: 180px;
        }

        #controls span {
            min-width: 45px;
            display: inline-block;
            text-align: left;
            font-weight: 600;
            color: #fff;
            font-size: 0.9em;
        }

        #controls button {
            cursor: pointer;
            background-color: #575757;
            border: none;
            font-weight: 500;
            min-width: 100px;
            text-align: center;
        }

        #controls button:hover {
            background-color: #686868;
        }

        #reset-view-btn {
            background-color: #d9534f;
        }

        #reset-view-btn:hover {
            background-color: #c9302c;
        }

        #add-files-btn {
            background-color: #5cb85c;
        }

        #add-files-btn:hover {
            background-color: #4cae4c;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }

        #hidden-file-input {
            display: none;
        }

        #main-view-area {
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            border: 3px dashed transparent;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            overflow: hidden;
            cursor: grab;
            margin-top: 15px;
            background-color: #252525;
            width: 100%;
            height: 100%;
        }

        #main-view-area.grabbing {
            cursor: grabbing;
        }

        #main-view-area.drag-over {
            border-color: #007bff;
        }

        #drop-info-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.3s ease;
            box-sizing: border-box;
            z-index: 10;
        }

        #main-view-area.no-images-loaded #drop-info-wrapper,
        #main-view-area.drag-over #drop-info-wrapper {
            opacity: 1;
        }

        #main-view-area.drag-over #drop-info-wrapper {
            background-color: rgba(30, 30, 30, 0.85);
        }

        #drop-info-icon {
            font-size: 3.5rem;
            color: #6c757d;
            margin-bottom: 15px;
        }

        #drop-info-text {
            color: #6c757d;
            font-size: 1.2rem;
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
        }

        #main-view-area.drag-over #drop-info-icon,
        #main-view-area.drag-over #drop-info-text {
            color: #eee;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .image-stack {
            position: absolute;
            top: 0;
            left: 0;
            line-height: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        .img-slot-container {
            position: absolute;
            display: block;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .img-slot-container img {
            position: absolute;
            display: block;
        }

        #manual-slider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            cursor: ew-resize;
            z-index: 100;
        }

        #manual-slider-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            border: 2px solid #333;
        }

        #slot0-container {
            z-index: 1;
        }

        #slot1-clipper {
            z-index: 2;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        #slot1-container {
            z-index: 1;
        }

        #slot2-clipper {
            z-index: 3;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        #slot2-container {
            z-index: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="controls">
        <div class="control-section" id="image-slots-controls">
            <!-- Image slot selectors will be dynamically generated here -->
        </div>
        <div class="separator"></div>
        <div class="control-section">
            <div class="control-group">
                <label for="comparison-mode-select">Comparison Mode:</label>
                <select id="comparison-mode-select">
                    <option value="swipe-horizontal" selected>Swipe (Horizontal)</option>
                    <option value="swipe-vertical">Swipe (Vertical)</option>
                    <option value="fade">Fade</option>
                    <option value="onion-skin">Onion Skin</option>
                    <option value="manual-slider">Manual Slider</option>
                </select>
            </div>
            <div id="onion-skin-controls" class="control-group hidden">
                <label for="opacity-slider">Opacity:</label>
                <div class="control-row">
                    <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5">
                    <span id="opacity-value">50%</span>
                </div>
            </div>
            <div id="manual-slider-controls" class="control-group hidden">
                <label for="manual-slider-direction">Direction:</label>
                <select id="manual-slider-direction">
                    <option value="horizontal" selected>Horizontal</option>
                    <option value="vertical">Vertical</option>
                </select>
            </div>
        </div>
        <div class="separator"></div>
        <div class="control-section">
            <div class="control-group">
                <label for="viewport-width-slider">Viewport Width:</label>
                <div class="control-row">
                    <input type="range" id="viewport-width-slider" min="10" max="100" step="1" value="100">
                    <span id="viewport-width-value">100%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="viewport-height-slider">Viewport Height:</label>
                <div class="control-row">
                    <input type="range" id="viewport-height-slider" min="10" max="100" step="1" value="100">
                    <span id="viewport-height-value">100%</span>
                </div>
            </div>
        </div>
        <div class="separator"></div>
        <div class="control-section">
            <div class="control-group">
                <label for="speed-slider">Animation Speed:</label>
                <div class="control-row">
                    <input type="range" id="speed-slider" min="0.05" max="2" step="0.01" value="0.25">
                    <span id="speed-value">0.25x</span>
                </div>
            </div>
            <div class="control-group">
                <label for="delay-slider">Animation Delay:</label>
                <div class="control-row">
                    <input type="range" id="delay-slider" min="0" max="50" step="1" value="10">
                    <span id="delay-value">10%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="zoom-slider">Zoom:</label>
                <div class="control-row">
                    <input type="range" id="zoom-slider" min="0.1" max="100" step="0.1" value="1">
                    <span id="zoom-value">1.0x</span>
                </div>
            </div>
        </div>
        <div class="separator"></div>
        <div class="control-section action-buttons-group">
            <button id="add-slot-btn">+ Add Slot</button>
            <button id="add-files-btn">Add Files</button>
            <input type="file" id="hidden-file-input" multiple accept="image/*">
            <button id="reset-view-btn">Reset</button>
        </div>
    </div>
    <div id="app-container">
        <div id="main-view-area" class="no-images-loaded">
            <div class="image-stack hidden">
                <!-- Image slots will be dynamically generated here -->
            </div>
            <div id="manual-slider-handle" class="hidden"></div>
            <div id="drop-info-wrapper">
                <div id="drop-info-icon">📤</div>
                <div id="drop-info-text">Drop images here or click "Add Files"</div>
            </div>
        </div>
    </div>
    <script>
        let DYNAMIC_AVAILABLE_IMAGES = [];
        const MAX_COMPARISON_SLOTS = 3;

        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const imageStack = document.querySelector('.image-stack');
            const imageSlotsControls = document.getElementById('image-slots-controls');
            const comparisonModeSelect = document.getElementById('comparison-mode-select');
            const mainViewArea = document.getElementById('main-view-area');
            const speedSlider = document.getElementById('speed-slider');
            const speedValueSpan = document.getElementById('speed-value');
            const delaySlider = document.getElementById('delay-slider');
            const delayValueSpan = document.getElementById('delay-value');
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomValueSpan = document.getElementById('zoom-value');
            const resetViewBtn = document.getElementById('reset-view-btn');
            const addFilesBtn = document.getElementById('add-files-btn');
            const addSlotBtn = document.getElementById('add-slot-btn');
            const hiddenFileInput = document.getElementById('hidden-file-input');
            const viewportWidthSlider = document.getElementById('viewport-width-slider');
            const viewportWidthValueSpan = document.getElementById('viewport-width-value');
            const viewportHeightSlider = document.getElementById('viewport-height-slider');
            const viewportHeightValueSpan = document.getElementById('viewport-height-value');

            // New mode controls
            const onionSkinControls = document.getElementById('onion-skin-controls');
            const opacitySlider = document.getElementById('opacity-slider');
            const opacityValue = document.getElementById('opacity-value');
            const manualSliderControls = document.getElementById('manual-slider-controls');
            const manualSliderDirection = document.getElementById('manual-slider-direction');
            const manualSliderHandle = document.getElementById('manual-slider-handle');


            // State
            let activeSlotData = [];
            let comparisonMode = 'swipe-horizontal';
            let currentSpeed = parseFloat(speedSlider.value);
            let currentDelay = parseFloat(delaySlider.value);
            let currentZoom = 1.0;

            let panX = 0, panY = 0;
            let isPanning = false;
            let lastPanX_mouse, lastPanY_mouse;
            let canvasWidth = 0, canvasHeight = 0;
            let viewportWidth = 0, viewportHeight = 0;
            let animationFrameId = null;
            let pendingViewUpdate = false;
            let firstLoadDone = false;
            let isDraggingManualSlider = false;
            let animationCursor = 0;
            let animationDirection = 1;

            // --- UI Control Updates ---
            function updateControlSpans() {
                speedValueSpan.textContent = currentSpeed.toFixed(2) + 'x';
                delayValueSpan.textContent = currentDelay + '%';
                zoomValueSpan.textContent = currentZoom.toFixed(1) + 'x';
                opacityValue.textContent = `${Math.round(opacitySlider.value * 100)}%`;
                viewportWidthValueSpan.textContent = `${viewportWidthSlider.value}%`;
                viewportHeightValueSpan.textContent = `${viewportHeightSlider.value}%`;
            }

            // --- Slot Management ---
            function addNewSlot(isBaseSlot = false) {
                const slotIndex = activeSlotData.length;
                const isComparisonSlot = !isBaseSlot;

                const controlGroup = document.createElement('div');
                controlGroup.className = 'control-group';

                const label = document.createElement('label');
                label.htmlFor = `slot${slotIndex}-select`;
                label.textContent = isBaseSlot ? 'Base Slot:' : `Comparison Slot ${slotIndex}:`;

                const select = document.createElement('select');
                select.id = `slot${slotIndex}-select`;
                select.addEventListener('change', (e) => handleSlotSelectionChange(e, slotIndex));

                controlGroup.appendChild(label);
                controlGroup.appendChild(select);
                imageSlotsControls.appendChild(controlGroup);

                const slotContainer = document.createElement('div');
                slotContainer.id = `slot${slotIndex}-container`;
                slotContainer.className = 'img-slot-container hidden';

                const img = document.createElement('img');
                img.id = `slot${slotIndex}-img`;
                img.alt = `${isBaseSlot ? 'Base' : 'Comparison'} Slot ${slotIndex} Image`;
                slotContainer.appendChild(img);

                let clipper = null;
                if (isComparisonSlot) {
                    clipper = document.createElement('div');
                    clipper.id = `slot${slotIndex}-clipper`;
                    clipper.className = 'hidden';
                    clipper.style.position = 'absolute';
                    clipper.style.top = '0';
                    clipper.style.left = '0';
                    clipper.style.height = '100%';
                    clipper.style.overflow = 'hidden';
                    clipper.style.backgroundColor = 'transparent';
                    clipper.style.zIndex = slotIndex + 1;
                    clipper.appendChild(slotContainer);
                    imageStack.appendChild(clipper);
                } else {
                    slotContainer.style.zIndex = 1;
                    imageStack.appendChild(slotContainer);
                }

                const newSlot = {
                    src: null, imgObject: new Image(), naturalWidth: 0, naturalHeight: 0, isLoaded: false, isLoading: false,
                    controlGroup, select, container: slotContainer, image: img, clipper
                };

                newSlot.imgObject.onload = () => imageLoadedOrFailed(slotIndex, true);
                newSlot.imgObject.onerror = () => imageLoadedOrFailed(slotIndex, false);

                activeSlotData.push(newSlot);
                populateSelectOptions();
            }

            // --- Zoom Logic ---
            function getZoomFromSlider(value) {
                const sliderValue = parseFloat(value);
                if (sliderValue < 50) {
                    return Math.pow(10, (sliderValue / 50.0) - 1); // Maps 0->0.1, 50->1
                } else {
                    return 1 + ((sliderValue - 50) / 50.0) * 19; // Maps 50->1, 100->20
                }
            }

            function getSliderFromZoom(zoomValue) {
                if (zoomValue < 1) {
                    return 50 * (Math.log10(zoomValue) + 1);
                } else {
                    return 50 + ((zoomValue - 1) / 19.0) * 50;
                }
            }


            // --- Event Listeners for Controls ---
            speedSlider.addEventListener('input', (e) => { currentSpeed = parseFloat(e.target.value); updateControlSpans(); });
            delaySlider.addEventListener('input', (e) => { currentDelay = parseFloat(e.target.value); updateControlSpans(); });

            comparisonModeSelect.addEventListener('change', (e) => {
                comparisonMode = e.target.value;
                onionSkinControls.classList.toggle('hidden', comparisonMode !== 'onion-skin');
                manualSliderControls.classList.toggle('hidden', comparisonMode !== 'manual-slider');
                requestAnimationFrame(processLoadedImagesAndUpdateView);
            });

            opacitySlider.addEventListener('input', (e) => {
                if (comparisonMode === 'onion-skin' && activeSlotData[1] && activeSlotData[1].isLoaded) {
                    activeSlotData[1].container.style.opacity = e.target.value;
                }
                updateControlSpans();
            });

            manualSliderDirection.addEventListener('change', () => {
                requestAnimationFrame(processLoadedImagesAndUpdateView);
            });


            addSlotBtn.addEventListener('click', () => addNewSlot(false));

            zoomSlider.addEventListener('input', (e) => {
                const oldZoom = currentZoom;
                currentZoom = getZoomFromSlider(e.target.value);
                updateControlSpans();

                if (!viewportWidth) return;
                const rect = mainViewArea.getBoundingClientRect();
                const mouseXInViewport = (rect.width / 2);
                const mouseYInViewport = (rect.height / 2);

                panX = mouseXInViewport - (mouseXInViewport - panX) * (currentZoom / oldZoom);
                if (canvasHeight * currentZoom >= viewportHeight) {
                    panY = mouseYInViewport - (mouseYInViewport - panY) * (currentZoom / oldZoom);
                } else {
                    panY = (viewportHeight - canvasHeight * currentZoom) / 2;
                }
                applyTransformations();
            });

            const createViewportSliderHandler = (isWidth) => (e) => {
                const oldDim = isWidth ? viewportWidth : viewportHeight;
                if (isWidth) {
                    mainViewArea.style.width = e.target.value + '%';
                } else {
                    mainViewArea.style.height = e.target.value + '%';
                }
                updateControlSpans();
                requestAnimationFrame(() => {
                    updateMainViewAreaDimensions();
                    const newDim = isWidth ? viewportWidth : viewportHeight;
                    if (isWidth) panX += (newDim - oldDim) / 2;
                    else panY += (newDim - oldDim) / 2;
                    applyTransformations();
                });
            };

            viewportWidthSlider.addEventListener('input', createViewportSliderHandler(true));
            viewportHeightSlider.addEventListener('input', createViewportSliderHandler(false));


            resetViewBtn.addEventListener('click', resetApp);
            addFilesBtn.addEventListener('click', () => hiddenFileInput.click());
            addSlotBtn.addEventListener('click', () => addNewSlot(false));
            hiddenFileInput.addEventListener('change', handleFileSelectionFromInput);

            // --- Image Selection and Loading ---
            function populateSelectOptions() {
                const emptyOptionHTML = `<option value="">-- Select Image --</option>`;
                activeSlotData.forEach(slot => {
                    const currentSelectedValue = slot.select.value;
                    let optionsHTML = emptyOptionHTML;
                    DYNAMIC_AVAILABLE_IMAGES.forEach((imgData) => {
                        optionsHTML += `<option value="${imgData.src}" ${imgData.src === currentSelectedValue ? 'selected' : ''}>${imgData.name}</option>`;
                    });
                    slot.select.innerHTML = optionsHTML;
                    slot.select.value = DYNAMIC_AVAILABLE_IMAGES.some(img => img.src === currentSelectedValue) ? currentSelectedValue : "";
                });
            }

            function addImageToAvailableList(name, dataURL) {
                if (!DYNAMIC_AVAILABLE_IMAGES.some(img => img.src === dataURL)) {
                    DYNAMIC_AVAILABLE_IMAGES.push({ name: name, src: dataURL });
                    populateSelectOptions();
                    return true;
                }
                return false;
            }

            function handleSlotSelectionChange(event, slotIndex) {
                const selectedSrc = event.target.value;
                const currentSlot = activeSlotData[slotIndex];

                if (currentSlot.isLoading) currentSlot.isLoading = false;
                Object.assign(currentSlot, { src: selectedSrc || null, isLoaded: false, naturalWidth: 0, naturalHeight: 0 });
                currentSlot.container.classList.add('hidden');
                currentSlot.image.src = "";

                if (currentSlot.src) {
                    currentSlot.isLoading = true;
                    currentSlot.imgObject.src = currentSlot.src;
                } else {
                    currentSlot.isLoading = false;
                    requestViewUpdate();
                }
            }

            function imageLoadedOrFailed(slotIndex, success) {
                const slot = activeSlotData[slotIndex];
                if (!slot.isLoading && slot.src) return;
                slot.isLoading = false;
                if (success) {
                    Object.assign(slot, { naturalWidth: slot.imgObject.naturalWidth, naturalHeight: slot.imgObject.naturalHeight, isLoaded: true });
                } else {
                    console.error(`Error loading: ${slot.src}`);
                    Object.assign(slot, { isLoaded: false, src: null });
                    slot.select.value = "";
                }
                requestViewUpdate();
            }

            // --- View Update Logic ---
            function requestViewUpdate() {
                if (!pendingViewUpdate) {
                    pendingViewUpdate = true;
                    requestAnimationFrame(() => {
                        processLoadedImagesAndUpdateView();
                        pendingViewUpdate = false;
                    });
                }
            }

            function processLoadedImagesAndUpdateView() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                manualSliderHandle.classList.add('hidden');

                const activeImagesForCanvas = activeSlotData.filter(d => d.isLoaded && d.src);

                updateModeAvailability(activeImagesForCanvas.length);


                if (activeImagesForCanvas.length === 0) {
                    canvasWidth = 0; canvasHeight = 0; firstLoadDone = false;
                } else {
                    if (!setupCanvasAndImages(activeImagesForCanvas)) {
                        canvasWidth = 0; canvasHeight = 0;
                        applyTransformations(); return;
                    }
                }

                updateMainViewAreaDimensions();

                if (!firstLoadDone && activeImagesForCanvas.length > 0) {
                    resetPanAndZoom(); firstLoadDone = true;
                } else if (activeImagesForCanvas.length === 0) {
                    resetPanAndZoom(false);
                }
                applyTransformations();

                activeSlotData.forEach((data) => {
                    // Reset styles before applying mode-specific ones
                    if(data.clipper) {
                        data.clipper.style.width = '100%';
                        data.clipper.style.height = '100%';
                        data.container.style.opacity = '1';
                    }

                    if (data.isLoaded && data.src) {
                        data.image.src = data.src;
                        data.container.classList.remove('hidden');
                        if (data.clipper) data.clipper.classList.remove('hidden');
                    } else {
                        data.container.classList.add('hidden');
                        if (data.clipper) data.clipper.classList.add('hidden');
                    }
                });

                const loadedComparisonSlots = activeSlotData.slice(1).filter(d => d.isLoaded && d.src);
                if (activeSlotData[0]?.isLoaded && loadedComparisonSlots.length > 0) {
                    if (comparisonMode.startsWith('swipe') || comparisonMode === 'fade') {
                        animate();
                    } else if (comparisonMode === 'onion-skin') {
                        activeSlotData[1].container.style.opacity = opacitySlider.value;
                    } else if (comparisonMode === 'manual-slider') {
                        setupManualSlider();
                    }
                }
            }

            function updateModeAvailability(activeImageCount) {
                const twoImageModes = ['onion-skin', 'manual-slider'];
                const options = comparisonModeSelect.options;

                for (let i = 0; i < options.length; i++) {
                    if (twoImageModes.includes(options[i].value)) {
                        options[i].disabled = activeImageCount > 2;
                    }
                }

                if (activeImageCount > 2 && twoImageModes.includes(comparisonMode)) {
                    comparisonModeSelect.value = 'swipe-horizontal';
                    comparisonMode = 'swipe-horizontal';
                    onionSkinControls.style.display = 'none';
                    manualSliderControls.style.display = 'none';
                }
            }

            function setupCanvasAndImages(activeImagesData) {
                let maxW = 0, maxH = 0;
                activeImagesData.forEach(data => {
                    maxW = Math.max(maxW, data.naturalWidth);
                    maxH = Math.max(maxH, data.naturalHeight);
                });
                if (maxW === 0 || maxH === 0) return false;

                canvasWidth = maxW; canvasHeight = maxH;
                imageStack.style.width = `${canvasWidth}px`;
                imageStack.style.height = `${canvasHeight}px`;

                activeSlotData.forEach(data => {
                    if (data.isLoaded && data.src) {
                        Object.assign(data.image.style, { width: `${canvasWidth}px`, height: `${canvasHeight}px`, left: '0px', top: '0px' });
                    }
                });
                return true;
            }

            function updateMainViewAreaDimensions() {
                const mainViewRect = mainViewArea.getBoundingClientRect();
                viewportWidth = mainViewRect.width;
                viewportHeight = mainViewRect.height;
            }

            function applyTransformations() {
                const hasActiveLoadedImages = activeSlotData.some(d => d.isLoaded && d.src);
                if (!imageStack || canvasWidth === 0 || canvasHeight === 0 || !hasActiveLoadedImages) {
                    imageStack.classList.add('hidden');
                    mainViewArea.classList.add('no-images-loaded');
                    return;
                }
                imageStack.classList.remove('hidden');
                mainViewArea.classList.remove('no-images-loaded');

                const scaledCanvasWidth = canvasWidth * currentZoom;
                const scaledCanvasHeight = canvasHeight * currentZoom;

                let minPanX = (scaledCanvasWidth < viewportWidth) ? (viewportWidth - scaledCanvasWidth) / 2 : viewportWidth - scaledCanvasWidth;
                let maxPanX = (scaledCanvasWidth < viewportWidth) ? (viewportWidth - scaledCanvasWidth) / 2 : 0;
                panX = Math.max(minPanX, Math.min(maxPanX, panX));

                let minPanY = (scaledCanvasHeight < viewportHeight) ? (viewportHeight - scaledCanvasHeight) / 2 : viewportHeight - scaledCanvasHeight;
                let maxPanY = (scaledCanvasHeight < viewportHeight) ? (viewportHeight - scaledCanvasHeight) / 2 : 0;
                panY = Math.max(minPanY, Math.min(maxPanY, panY));


                imageStack.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;

                if (comparisonMode === 'manual-slider') {
                    setupManualSlider();
                }
            }

            function resetPanAndZoom(resetSliders = true) {
                if (resetSliders) {
                    currentZoom = 1.0;
                    zoomSlider.value = getSliderFromZoom(1.0);
                }
                panX = 0; panY = 0;
                if (viewportWidth > 0 && viewportHeight > 0) {
                    if (canvasWidth > 0 && canvasHeight > 0) {
                        if (canvasWidth * currentZoom < viewportWidth) panX = (viewportWidth - canvasWidth * currentZoom) / 2;
                        if (canvasHeight * currentZoom < viewportHeight) panY = (viewportHeight - canvasHeight * currentZoom) / 2;
                    }
                }
                if (resetSliders) updateControlSpans();
            }

            function resetApp() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;

                // Clear all children except the handle
                while (imageStack.firstChild && imageStack.firstChild !== manualSliderHandle) {
                    imageStack.removeChild(imageStack.firstChild);
                }
                 while (imageStack.lastChild && imageStack.lastChild !== manualSliderHandle) {
                    imageStack.removeChild(imageStack.lastChild);
                }

                imageSlotsControls.innerHTML = '';
                activeSlotData = [];

                comparisonModeSelect.value = 'swipe-horizontal';
                onionSkinControls.classList.add('hidden');
                manualSliderControls.classList.add('hidden');
                opacitySlider.value = 0.5;

                currentSpeed = parseFloat(speedSlider.value);
                currentDelay = parseFloat(delaySlider.value);
                firstLoadDone = false;
                resetPanAndZoom(true);
                updateControlSpans();

                addNewSlot(true); // Base Slot
                addNewSlot(false); // First Comparison Slot

                processDroppedOrSelectedFiles([]); // Clear selections
                requestViewUpdate();
            }

            // --- File Handling ---
            function processDroppedOrSelectedFiles(files) {
                if (files.length === 0) return;
                let filesToProcess = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (filesToProcess.length === 0) return;

                let firstNewImageSrcForAutoSelect = null;
                let processedCount = 0;
                filesToProcess.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const dataURL = event.target.result;
                        const added = addImageToAvailableList(file.name, dataURL);
                        if (added && !firstNewImageSrcForAutoSelect) firstNewImageSrcForAutoSelect = dataURL;
                        processedCount++;
                        if (processedCount === filesToProcess.length && firstNewImageSrcForAutoSelect) {
                            const emptySlot = activeSlotData.find(slot => !slot.src);
                            if (emptySlot) {
                                emptySlot.select.value = firstNewImageSrcForAutoSelect;
                                emptySlot.select.dispatchEvent(new Event('change'));
                            }
                        }
                    };
                    reader.onerror = (error) => { console.error("File read error:", file.name, error); processedCount++; };
                    reader.readAsDataURL(file);
                });
            }

            function handleFileSelectionFromInput(event) {
                processDroppedOrSelectedFiles(event.target.files);
                event.target.value = null;
            }

            // --- Drag & Drop Events ---
            ['dragenter', 'dragover', 'dragleave', 'dragend'].forEach(eventName => {
                mainViewArea.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (eventName === 'dragenter' || eventName === 'dragover')
                        mainViewArea.classList.add('drag-over');
                    else
                        mainViewArea.classList.remove('drag-over');
                });
            });

            mainViewArea.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                mainViewArea.classList.remove('drag-over');
                processDroppedOrSelectedFiles(e.dataTransfer.files);
            });

            // --- Viewport Calculations ---
            function getVisibleImageRangePercents() {
                if (!canvasWidth || !viewportWidth || currentZoom === 0)
                    return { visibleStartPercent: 0, visibleEndPercent: 100 };
                const imgCoordAtViewportLeft = -panX / currentZoom;
                const imgCoordAtViewportRight = (viewportWidth - panX) / currentZoom;
                let visibleStartPercent = (imgCoordAtViewportLeft / canvasWidth) * 100;
                let visibleEndPercent = (imgCoordAtViewportRight / canvasWidth) * 100;
                visibleStartPercent = Math.max(0, Math.min(100, visibleStartPercent));
                visibleEndPercent = Math.max(0, Math.min(100, visibleEndPercent));
                return { visibleStartPercent, visibleEndPercent };
            }

            // --- Animation ---
            function animateLines() {
                const isSlot1ClipperVisible = slotClippers[1] && !slotClippers[1].classList.contains('hidden');
                const isSlot2ClipperVisible = slotClippers[2] && !slotClippers[2].classList.contains('hidden');
                const comparingThreeImages = isSlot1ClipperVisible && isSlot2ClipperVisible;

                if (!isSlot1ClipperVisible && !isSlot2ClipperVisible) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                    return;
                }

                const { visibleStartPercent, visibleEndPercent } = getVisibleImageRangePercents();
                let actualCursorRangeStart, actualCursorRangeEnd;

                if (comparingThreeImages) {
                    actualCursorRangeStart = visibleStartPercent;
                    actualCursorRangeEnd = visibleEndPercent + currentDelay;
                } else {
                    actualCursorRangeStart = visibleStartPercent;
                    actualCursorRangeEnd = visibleEndPercent;
                }

                lineAnimationCursor += currentSpeed * lineAnimationDirection;

                if (lineAnimationCursor >= actualCursorRangeEnd) {
                    lineAnimationCursor = actualCursorRangeEnd;
                    lineAnimationDirection = -1;
                } else if (lineAnimationCursor <= actualCursorRangeStart) {
                    lineAnimationCursor = actualCursorRangeStart;
                    lineAnimationDirection = 1;
                }

                if (isSlot1ClipperVisible) {
                    slotClippers[1].style.width = `${Math.max(visibleStartPercent, Math.min(visibleEndPercent, lineAnimationCursor))}%`;
                }
                if (comparingThreeImages && isSlot2ClipperVisible) {
                    slotClippers[2].style.width = `${Math.max(visibleStartPercent, Math.min(visibleEndPercent, lineAnimationCursor - currentDelay))}%`;
                }

                animationFrameId = requestAnimationFrame(animateLines);
            }

            // --- Mouse & Wheel Events for Panning/Zooming ---
            manualSliderHandle.addEventListener('mousedown', (e) => {
                e.preventDefault(); // Prevent text selection/drag-and-drop
                isDraggingManualSlider = true;
            });
            manualSliderHandle.addEventListener('dragstart', (e) => e.preventDefault());

            mainViewArea.addEventListener('mousedown', (e) => {
                if (e.target === manualSliderHandle || e.target.parentElement === manualSliderHandle) return;
                if (e.button !== 0) return;
                isPanning = true;
                lastPanX_mouse = e.clientX;
                lastPanY_mouse = e.clientY;
                mainViewArea.classList.add('grabbing');
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                const dx = e.clientX - lastPanX_mouse;
                const dy = e.clientY - lastPanY_mouse;
                lastPanX_mouse = e.clientX;
                lastPanY_mouse = e.clientY;
                panX += dx;
                panY += dy;
                applyTransformations();
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button !== 0) return;
                if (isPanning) {
                    isPanning = false;
                    mainViewArea.classList.remove('grabbing');
                }
            });

            mainViewArea.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.1;
                const oldZoom = currentZoom;
                const oldScaledCanvasHeight = canvasHeight * oldZoom;
                if (!viewportWidth) return;
                if (e.deltaY < 0)
                    currentZoom = Math.min(parseFloat(zoomSlider.max), currentZoom * (1 + zoomFactor));
                else
                    currentZoom = Math.max(parseFloat(zoomSlider.min), currentZoom / (1 + zoomFactor));
                zoomSlider.value = currentZoom;
                updateControlSpans();

                const rect = mainViewArea.getBoundingClientRect();
                const mouseXInViewport = e.clientX - rect.left;
                const mouseYInViewport = e.clientY - rect.top;

                panX = mouseXInViewport - (mouseXInViewport - panX) * (currentZoom / oldZoom);

                const newScaledCanvasHeight = canvasHeight * currentZoom;
                if (oldScaledCanvasHeight >= viewportHeight && newScaledCanvasHeight < viewportHeight) {
                    panY = (viewportHeight - newScaledCanvasHeight) / 2;
                } else if (newScaledCanvasHeight >= viewportHeight) {
                    panY = mouseYInViewport - (mouseYInViewport - panY) * (currentZoom / oldZoom);
                } else {
                    panY = (viewportHeight - newScaledCanvasHeight) / 2;
                }
                applyTransformations();
            });

            window.addEventListener('resize', () => {
                updateMainViewAreaDimensions();
                applyTransformations();
            });

            // --- Viewport Calculations ---
            function getVisibleImageRangePercents() {
                if (!canvasWidth || !viewportWidth || currentZoom === 0) return { visibleStartPercent: 0, visibleEndPercent: 100, visibleTopPercent: 0, visibleBottomPercent: 100 };
                const imgCoordAtViewportLeft = -panX / currentZoom;
                const imgCoordAtViewportRight = (viewportWidth - panX) / currentZoom;
                const imgCoordAtViewportTop = -panY / currentZoom;
                const imgCoordAtViewportBottom = (viewportHeight - panY) / currentZoom;
                return {
                    visibleStartPercent: Math.max(0, Math.min(100, (imgCoordAtViewportLeft / canvasWidth) * 100)),
                    visibleEndPercent: Math.max(0, Math.min(100, (imgCoordAtViewportRight / canvasWidth) * 100)),
                    visibleTopPercent: Math.max(0, Math.min(100, (imgCoordAtViewportTop / canvasHeight) * 100)),
                    visibleBottomPercent: Math.max(0, Math.min(100, (imgCoordAtViewportBottom / canvasHeight) * 100))
                };
            }

            // --- Animation & Manual Modes ---
            function animate() {
                const activeComparisonSlots = activeSlotData.slice(1).filter(d => d.isLoaded && d.src && d.clipper);
                const isAnimated = comparisonMode.startsWith('swipe') || comparisonMode === 'fade';
                if (!activeSlotData[0]?.isLoaded || activeComparisonSlots.length === 0 || !isAnimated) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                    if(activeComparisonSlots.length > 0) { // Reset clipper if animation stops
                        activeComparisonSlots.forEach(slot => {
                            slot.clipper.style.width = '100%';
                            slot.clipper.style.height = '100%';
                        });
                    }
                    return;
                }

                const { visibleStartPercent, visibleEndPercent, visibleTopPercent, visibleBottomPercent } = getVisibleImageRangePercents();

                let rangeStart, rangeEnd;
                if (comparisonMode === 'swipe-horizontal' || comparisonMode === 'fade') {
                    rangeStart = visibleStartPercent;
                    rangeEnd = visibleEndPercent;
                } else { // swipe-vertical
                    rangeStart = visibleTopPercent;
                    rangeEnd = visibleBottomPercent;
                }

                const totalDelay = currentDelay * (activeComparisonSlots.length - 1);
                const actualCursorRangeEnd = rangeEnd + totalDelay;

                if(!animationFrameId) { // Set initial cursor position
                    animationCursor = rangeStart;
                    animationDirection = 1;
                }

                animationCursor += currentSpeed * animationDirection;
                if (animationCursor >= actualCursorRangeEnd) {
                    animationCursor = actualCursorRangeEnd; animationDirection = -1;
                } else if (animationCursor <= rangeStart) {
                    animationCursor = rangeStart; animationDirection = 1;
                }

                if (comparisonMode.startsWith('swipe')) {
                    activeComparisonSlots.forEach((slot, index) => {
                        const delayedCursor = animationCursor - (currentDelay * index);
                        if (comparisonMode === 'swipe-horizontal') {
                            slot.clipper.style.width = `${Math.max(rangeStart, Math.min(rangeEnd, delayedCursor))}%`;
                        } else { // swipe-vertical
                            slot.clipper.style.height = `${Math.max(rangeStart, Math.min(rangeEnd, delayedCursor))}%`;
                        }
                    });
                } else if (comparisonMode === 'fade') {
                    activeComparisonSlots.forEach((slot, index) => {
                        const delayedCursor = animationCursor - (currentDelay * index);
                        const opacity = (delayedCursor - rangeStart) / (rangeEnd - rangeStart);
                        slot.container.style.opacity = Math.max(0, Math.min(1, opacity));
                    });
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            function setupManualSlider() {
                const comparisonSlot = activeSlotData[1];
                if (!comparisonSlot || !comparisonSlot.isLoaded) return;
                manualSliderHandle.classList.remove('hidden');

                const isHorizontal = manualSliderDirection.value === 'horizontal';
                manualSliderHandle.style.cursor = isHorizontal ? 'ew-resize' : 'ns-resize';
                manualSliderHandle.style.width = isHorizontal ? '2px' : '100%';
                manualSliderHandle.style.height = isHorizontal ? '100%' : '2px';

                // Reset position and clipping
                manualSliderHandle.style.left = '50%';
                manualSliderHandle.style.top = '50%';
                if (comparisonSlot.clipper) {
                    comparisonSlot.clipper.style.width = '50%';
                    comparisonSlot.clipper.style.height = '50%';
                }
            }


            manualSliderHandle.addEventListener('mousedown', (e) => {
                e.preventDefault(); // Prevent text selection/drag-and-drop
                isDraggingManualSlider = true;
            });
            manualSliderHandle.addEventListener('dragstart', (e) => e.preventDefault());


            // --- Mouse & Wheel Events ---
            mainViewArea.addEventListener('mousedown', (e) => {
                if (e.target === manualSliderHandle || e.target.parentElement === manualSliderHandle) return;
                if (e.button !== 0) return;

                isPanning = true;
                lastPanX_mouse = e.clientX; lastPanY_mouse = e.clientY;
                mainViewArea.classList.add('grabbing');
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX += e.clientX - lastPanX_mouse;
                    panY += e.clientY - lastPanY_mouse;
                    lastPanX_mouse = e.clientX;
                    lastPanY_mouse = e.clientY;
                    applyTransformations();
                } else if (isDraggingManualSlider) {
                    const viewRect = mainViewArea.getBoundingClientRect();
                    const isHorizontal = manualSliderDirection.value === 'horizontal';

                    if (isHorizontal) {
                        const x = Math.max(viewRect.left, Math.min(viewRect.right, e.clientX));
                        const percent = ((x - viewRect.left) / viewRect.width) * 100;
                        manualSliderHandle.style.left = `${percent}%`;
                        // Y is locked to 50%
                        manualSliderHandle.style.top = '50%';
                        if (activeSlotData[1]) activeSlotData[1].clipper.style.width = `${percent}%`;
                    } else {
                        const y = Math.max(viewRect.top, Math.min(viewRect.bottom, e.clientY));
                        const percent = ((y - viewRect.top) / viewRect.height) * 100;
                        manualSliderHandle.style.top = `${percent}%`;
                        // X is locked to 50%
                        manualSliderHandle.style.left = '50%';
                        if (activeSlotData[1]) activeSlotData[1].clipper.style.height = `${percent}%`;
                    }
                }
            });
            window.addEventListener('mouseup', (e) => {
                if (e.button !== 0) return;
                isPanning = false;
                isDraggingManualSlider = false;
                mainViewArea.classList.remove('grabbing');
            });
            mainViewArea.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.1;
                const oldZoom = currentZoom;
                if (!viewportWidth) return;

                if (e.deltaY < 0) {
                    currentZoom = Math.min(20, currentZoom * (1 + zoomFactor));
                } else {
                    currentZoom = Math.max(0.1, currentZoom / (1 + zoomFactor));
                }
                zoomSlider.value = getSliderFromZoom(currentZoom);
                updateControlSpans();

                const rect = mainViewArea.getBoundingClientRect();
                const mouseXInViewport = e.clientX - rect.left;
                const mouseYInViewport = e.clientY - rect.top;

                panX = mouseXInViewport - (mouseXInViewport - panX) * (currentZoom / oldZoom);
                if (canvasHeight * currentZoom >= viewportHeight) {
                     panY = mouseYInViewport - (mouseYInViewport - panY) * (currentZoom / oldZoom);
                } else {
                    panY = (viewportHeight - canvasHeight * currentZoom) / 2;
                }
                applyTransformations();
            });

            window.addEventListener('resize', () => {
                updateMainViewAreaDimensions();
                applyTransformations();
            });

            // --- Initial Setup ---
            resetApp();
        });
    </script>
</body>
